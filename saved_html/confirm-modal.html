<div class="confirm-match-modal">
  <div class="modal-content">
    <div class="waiting-for-confirm">
      <h3 class="title">Your match is ready</h3>
      <div class="confirm-within">Confirm your participation within</div>
      <div class="countdown"><span class="countdown-render">00:08</span></div>
      <button class="primary-button md gradient">Accept</button>
    </div>
    <div class="disclaimer">
      When you start a game of Renown, you're agreeing to stay for the entire
      match, usually lasting 30-45 minutes. Leaving the match once you've joined
      will result in a penalty.
    </div>
  </div>
</div>
